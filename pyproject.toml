[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miraios"
version = "0.13.0"
description = "Plano de controle local, verificável e seguro para Edge AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Projeto Hikari" }
]
keywords = ["ai", "edge-ai", "onnx", "onnxruntime", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
discovery = [
    "zeroconf>=0.132.0",
]
dev = [
    "bandit>=1.9.0",
    "build>=1.2.0",
    "coverage[toml]>=7.6.0",
    "hypothesis>=6.100.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/start6202783-dotcom/MiraiOS"
Documentation = "https://github.com/start6202783-dotcom/MiraiOS#readme"
Issues = "https://github.com/start6202783-dotcom/MiraiOS/issues"
Repository = "https://github.com/start6202783-dotcom/MiraiOS.git"

[project.scripts]
mirai = "mirai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mirai"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "BLE", "C4", "E", "F", "I", "ISC", "SIM", "UP", "W"]
ignore = ["SIM105", "SIM117"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["build/"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "zeroconf"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "onnx", "onnx.*"]
follow_imports = "skip"
