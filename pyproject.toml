[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miraios"
version = "0.5.0"
description = "CLI do MiraiOS — The Future Runs Local"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Projeto Hikari" }
]
dependencies = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
]

[project.scripts]
mirai = "mirai.main:main"

[tool.setuptools.packages.find]
where = ["src"]
