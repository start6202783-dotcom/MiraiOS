[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "miraios"
version = "0.7.0"
description = "Deploy, lifecycle e inferência ONNX em dispositivos Edge AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Projeto Hikari" }
]
keywords = ["ai", "edge-ai", "onnx", "onnxruntime", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/start6202783-dotcom/MiraiOS"
Documentation = "https://github.com/start6202783-dotcom/MiraiOS#readme"
Issues = "https://github.com/start6202783-dotcom/MiraiOS/issues"
Repository = "https://github.com/start6202783-dotcom/MiraiOS.git"

[project.scripts]
mirai = "mirai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
