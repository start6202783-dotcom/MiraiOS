name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Test
        run: python -m pytest

  arm64:
    name: ARM64 / Python 3.12
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Confirm native architecture
        run: |
          python -c "import platform; assert platform.machine() in {'aarch64', 'arm64'}, platform.machine()"

      - name: Compile and test
        run: |
          python -m compileall -q src tests scripts
          python -m pytest

  quality:
    name: Quality and security gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type-check
        run: python -m mypy src/mirai --cache-dir=/tmp/miraios-mypy-cache

      - name: Security scan
        run: python -m bandit -q -r src/mirai

      - name: Dependency audit
        run: python -m pip_audit --requirement requirements.txt

      - name: Branch coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report

  package:
    name: Build distribution
    needs: [test, arm64, quality]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install --upgrade build pip

      - name: Build wheel and source archive
        run: python -m build

      - name: Smoke-test wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          mirai --version
          python -c "from mirai.package import MIRAI_FORMAT_VERSION; assert MIRAI_FORMAT_VERSION == 1"

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miraios-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
